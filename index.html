<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Multiplayer Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
       <div><h1 class="heading">Online Multiplayer Rock Paper Scissors</h1></div>
    <div class="container">
        <div id="login-container">
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="connectToGame()">Join Game</button>
        </div>
        <div id="game-container" style="display:none;">
            <h2 id="player-id"></h2>
            <div id="players"></div>
            <div class="choices">
                <button onclick="makeChoice('rock')">Rock</button>
                <button onclick="makeChoice('paper')">Paper</button>
                <button onclick="makeChoice('scissors')">Scissors</button>
            </div>
            <div id="result"></div>
        </div>
    </div> 
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
